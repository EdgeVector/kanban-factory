name: ci-required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Merge gate (.lastgit/ci.sh)
        env:
          NO_COLOR: "1"
        run: bash .lastgit/ci.sh

  ci-required:
    name: ci-required
    if: always()
    needs: [gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to succeed
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          test "$GATE_RESULT" = "success" || { echo "gate result: $GATE_RESULT" >&2; exit 1; }
